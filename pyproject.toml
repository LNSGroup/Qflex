[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relax"
version = "0.1.0"
description = "Qflex reinforcement learning codebase built on JAX."
readme = "README.md"
requires-python = ">=3.8"

[tool.black]
line-length = 120
target-version = ['py39']
